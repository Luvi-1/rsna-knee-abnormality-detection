# PROVISIONAL ONTOLOGY v0 — NOT EXPERT-APPROVED.
# Research-only; every rule requires qualified medical review before clinical or submission use.
schema_version: 1
ontology_version: "provisional-v0"
created_utc: "2026-08-22"
status: provisional_not_expert_approved

# Shared four-state semantics apply to every target unless overridden below.
# not_mentioned is NEVER equivalent to negative.
shared_states:
  positive: "Finding explicitly described as present in the current clinical context."
  negative: "Finding explicitly stated absent, ruled out, normal, or unremarkable in current context."
  uncertain: "Finding suspected, possible, cannot be excluded, equivocal, or hedged without commitment."
  not_mentioned: "No relevant terminology appears anywhere in the report; status remains unknown."

shared_policies:
  four_state_only: true
  not_mentioned_is_negative: false
  missing_label_semantics: unknown_not_negative
  impression_priority_over_findings: true
  evidence_span_required_for_positive_and_uncertain: true
  severity_recorded_but_does_not_flip_state: true
  laterality_must_match_target_scope: true

# Ambiguity resolutions requested by mission brief §9.
ambiguity_resolutions:
  meniscal_degeneration_vs_tear:
    decision: degeneration_is_NOT_a_tear
    rationale: "Degeneration/mucoid signal without morphologic disruption is chronic, not acute tear. Tear requires morphology change (slope, flap, complex, radial, bucket-handle, horizontal cleavage)."
    review_flag: true
  postoperative_meniscal_morphology:
    decision: post_surgical_signal_without_new_tear_is_NOT_positive_unless_new_tear_stated
    rationale: "Prior partial meniscectomy or repair changes signal; only new/displaced/complex tear counts."
    review_flag: true
  mucoid_acl_vs_injury:
    decision: mucoid_degeneration_alone_is_NOT_ACL_injury
    rationale: "Mucoid/cystic ACL degeneration is chronic; injury requires fiber disruption, edema, or discontinuity."
    review_flag: true
  acl_graft_vs_native_tear:
    decision: graft_status_reported_separately_from_native_ACL
    rationale: "Reconstructed graft is postoperative context. Graft intact does NOT mean native ACL normal. Graft tear IS positive for ACL target."
    review_flag: true
  healed_chronic_mcl_change:
    decision: healed_or_chronic_thickening_alone_is_NOT_active_MCL_injury
    rationale: "Old MCL sprain with residual thickening/calcification is historical. Active injury requires edema, disruption, or new description."
    review_flag: true
  trace_physiologic_fluid_vs_effusion:
    decision: trace_physiologic_fluid_is_NEGATIVE_for_effusion
    rationale: "'Trace fluid' or 'physiologic amount' implies no pathologic effusion."
    review_flag: false
  effusion_vs_synovitis:
    decision: separate_targets_with_overlap_note
    rationale: "Effusion = joint fluid volume. Synovitis = synovial thickening/enhancement/inflammation. They may coexist but neither implies the other."
    review_flag: false
  bakers_cyst_vs_popliteal_abnormality:
    decision: Baker_cyst_requires_communication_with_gastrocnemius_semi_membranosus_bursa_OR_classic_description
    rationale: "Generic popliteal mass/cyst does NOT count as Baker cyst without characteristic location/communication."
    review_flag: true
  traumatic_bone_contusion_vs_degenerative_edema:
    decision: contusion_requires_trauma_context_OR_pattern_consistent_with_acute_bone_marrow_edema
    rationale: "Subchondral cysts, geodes, or marrow changes attributed to OA are NOT contusions."
    review_flag: true
  acute_vs_healed_fracture:
    decision: acute fracture = positive; healed/old fracture without acute component = NOT positive
    rationale: "Historical healed fracture lines, old callus, remote surgical hardware are not active findings."
    review_flag: false
  insufficiency_stress_fracture:
    decision: insufficiency_or_stress_fracture_COUNTS_as_positive_fracture
    rationale: "These are fracture diagnoses even without trauma; they are clinically significant."
    review_flag: false
  cartilage_damage_vs_compartment_OA:
    decision: focal_cartilage_defect_is_NOT_OA; compartment-level_joint_space_narrowing_plus_osteophyte_or_subchondral_change_IS_OA
    rationale: "OA is compartment-level degenerative disease, not isolated chondral fissure/focal defect."
    review_flag: true

targets:
  - column: "ACL"
    clinical_concept: "Anterior cruciate ligament injury or tear"
    anatomical_scope: "Native ACL or reconstructed ACL graft within intercondylar notch"
    positive_terms:
      - "ACL tear"
      - "ACL rupture"
      - "anterior cruciate ligament tear"
      - "ACL injury"
      - "ACL disruption"
      - "full-thickness ACL tear"
      - "partial-thickness ACL tear"
      - "interstitial ACL tear"
      - "graft tear"
      - "graft rupture"
    negative_terms:
      - "ACL intact"
      - "ACL is intact"
      - "normal ACL"
      - "unremarkable ACL"
      - "no ACL tear"
      - "ACL is normal"
    uncertain_terms:
      - "possible ACL tear"
      - "cannot exclude ACL injury"
      - "questionable ACL"
      - "equivocal ACL"
    related_do_not_count:
      - "mucoid degeneration of ACL"
      - "ACL ganglion cyst"
      - "intercondylar notch cyst"
      - "synovial proliferation near ACL"
    ambiguity_notes: "Mucoid degeneration alone is NOT positive. Graft intact ≠ native normal."
    acute_vs_chronic: both_count
    historical_handling: old_healed_ACL_scar_without_active_injury_is_negative_if_described_as_remote
    postoperative_handling: graft_status_tracked_under_same_column; native_and_graft_are_distinct_concepts
    laterality: knee_level_no_side_qualifier_required

  - column: "MCL"
    clinical_concept: "Medial collateral ligament injury"
    anatomical_scope: "Medial collateral ligament complex (superficial + deep fibers)"
    positive_terms:
