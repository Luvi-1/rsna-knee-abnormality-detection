      - "Pellegrini-Stieda lesion" # calcification at femoral attachment from OLD injury
      - "pes anserine tendinopathy"
      - "medial retinacular strain"
    ambiguity_notes: "Chronic/healed thickening without edema is NOT active injury."
    acute_vs_chronic: both_count_but_historical_healed_change_is_NOT_active
    laterality: medial_side_of_indexed_knee

