name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      UV_NO_EDITABLE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"
          enable-cache: true
      - name: Install Python
        run: uv python install 3.11
      - name: Sync locked environment
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Static types
        run: uv run mypy src
      - name: Synthetic tests
        run: uv run pytest
      - name: Competition contract
        run: uv run python scripts/check_competition_contract.py docs/competition_contract/contract.yaml
      - name: Sensitive file guard
        run: uv run python scripts/check_no_sensitive_files.py
      - name: Secret scan
        run: uv run detect-secrets-hook --baseline .secrets.baseline $(git ls-files)
      - name: Dependency vulnerability scan
        run: |
          uv export --quiet --locked --all-groups --no-emit-project --output-file /tmp/audit-requirements.txt
          uv run pip-audit --strict --requirement /tmp/audit-requirements.txt
