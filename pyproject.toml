[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rsna-knee"
version = "0.1.0"
description = "Private competition research tooling for RSNA Knee Abnormality Detection"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic==2.13.4",
]

[project.scripts]
rsna-knee = "rsna_knee.cli:main"

[dependency-groups]
dev = [
    "detect-secrets==1.5.0",
    "mypy==2.3.0",
    "pip-audit==2.10.1",
    "pre-commit==4.6.1",
    "pytest==9.1.1",
    "ruff==0.16.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rsna_knee"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.uv]
package = true
